<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Dynamic Pulse Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4, 4; opacity: 0.6; }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 10, 15;
      animation: dash 25s linear infinite;
    }
    .floating-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: float 5s ease-in-out infinite alternate-reverse;
    }
    @keyframes pulse {
      0% { r: 120px; opacity: 0.25; }
      100% { r: 160px; opacity: 0.45; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .banner-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.2px;
    }
    .banner-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Background Elements (Placed in background layer) -->
  <g opacity="0.6">
    <circle class="pulse-circle" cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="pulse-circle" cx="1050" cy="280" r="150" fill="#a855f7" filter="url(#glow)" />
    <circle cx="600" cy="180" r="220" fill="#4338ca" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Subtle Tech Grid Lines in Background -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Cyber/Network Pathways -->
  <path class="flow-line" d="M -50 100 Q 300 20 600 120 T 1250 80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path class="flow-line" d="M -50 260 Q 350 320 700 220 T 1250 250" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.35" />

  <!-- Background Animated Pill Cards (Off to sides and lower background) -->
  <g class="floating-card" opacity="0.8">
    <rect x="60" y="270" width="220" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="85" cy="291" r="6" fill="#38bdf8" />
    <text x="102" y="296" fill="#e2e8f0" class="banner-badge">🤖 Browser-use &amp; Stagehand</text>
  </g>

  <g class="floating-card-2" opacity="0.8">
    <rect x="920" y="55" width="220" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="945" cy="76" r="6" fill="#818cf8" />
    <text x="962" y="81" fill="#e2e8f0" class="banner-badge">⚡ Playwright &amp; Puppeteer</text>
  </g>

  <g class="floating-card" opacity="0.8">
    <rect x="910" y="265" width="230" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="935" cy="286" r="6" fill="#c084fc" />
    <text x="952" y="291" fill="#e2e8f0" class="banner-badge">🌐 Scrape &amp; LLM Extraction</text>
  </g>

  <!-- Foreground Title and Subtitle Area (Guaranteed Clean Foreground Visibility) -->
  <!-- Subtle dark backing shield ensuring high readability -->
  <rect x="220" y="65" width="760" height="210" rx="24" fill="#030712" fill-opacity="0.75" stroke="#334155" stroke-width="1" />

  <g text-anchor="middle">
    <!-- Top Category Tag -->
    <rect x="440" y="90" width="320" height="28" rx="14" fill="url(#sub-grad)" opacity="0.25" />
    <rect x="440" y="90" width="320" height="28" rx="14" fill="none" stroke="url(#sub-grad)" stroke-width="1" />
    <text x="600" y="109" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">WEB AGENTS &amp; BROWSER AUTOMATION</text>

    <!-- Main Title -->
    <text x="600" y="165" fill="url(#text-grad)" class="banner-title" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome AI Agent Web Automation
    </text>

    <!-- Main Subtitle -->
    <text x="600" y="212" fill="#94a3b8" class="banner-sub">
      The Curated Index of Autonomous Browser Agents, LLM Scrapers &amp; Web Infrastructure
    </text>

    <!-- Feature Highlights -->
    <g transform="translate(365, 235)">
      <text x="0" y="16" fill="#38bdf8" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✨ Computer-Use</text>
      <circle cx="115" cy="12" r="3" fill="#64748b" />
      <text x="135" y="16" fill="#818cf8" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">🚀 Headless Browsers</text>
      <circle cx="285" cy="12" r="3" fill="#64748b" />
      <text x="305" y="16" fill="#c084fc" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">🧠 Agent-Native Data</text>
    </g>
  </g>
</svg>
