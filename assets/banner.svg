<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#bae6fd"/></linearGradient><linearGradient id="sub-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse{0%{r:120px;opacity:.25}}@keyframes float{0%{transform:translateY(0)}}.grid-line{stroke:#1e293b;stroke-width:1;stroke-dasharray:4,4;opacity:.6}.pulse-circle{animation:pulse 4s ease-in-out infinite alternate}.flow-line{stroke-dasharray:10,15;animation:dash 25s linear infinite}.floating-card{animation:float 6s ease-in-out infinite alternate}.floating-card-2{animation:float 5s ease-in-out infinite alternate-reverse}.banner-title{font-weight:900;font-size:46px;letter-spacing:-.5px}.banner-badge,.banner-sub,.banner-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.banner-sub{font-weight:500;font-size:19px;letter-spacing:.2px}.banner-badge{font-weight:600;font-size:13px}</style><rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/><g opacity=".6"><circle cx="150" cy="80" r="140" fill="#38bdf8" class="pulse-circle" filter="url(#glow)"/><circle cx="1050" cy="280" r="150" fill="#a855f7" class="pulse-circle" filter="url(#glow)"/><circle cx="600" cy="180" r="220" fill="#4338ca" filter="url(#glow)" opacity=".15"/></g><g class="grid-line"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="800" x2="800" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/></g><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 100 Q 300 20 600 120 T 1250 80" class="flow-line" opacity=".4"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M -50 260 Q 350 320 700 220 T 1250 250" class="flow-line" opacity=".35"/><g class="floating-card" opacity=".8"><rect width="220" height="42" x="60" y="270" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="21"/><circle cx="85" cy="291" r="6" fill="#38bdf8"/><text x="102" y="296" fill="#e2e8f0" class="banner-badge">🤖 Browser-use &amp; Stagehand</text></g><g class="floating-card-2" opacity=".8"><rect width="220" height="42" x="920" y="55" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" rx="21"/><circle cx="945" cy="76" r="6" fill="#818cf8"/><text x="962" y="81" fill="#e2e8f0" class="banner-badge">⚡ Playwright &amp; Puppeteer</text></g><g class="floating-card" opacity=".8"><rect width="230" height="42" x="910" y="265" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="21"/><circle cx="935" cy="286" r="6" fill="#c084fc"/><text x="952" y="291" fill="#e2e8f0" class="banner-badge">🌐 Scrape &amp; LLM Extraction</text></g><rect width="760" height="210" x="220" y="65" fill="#030712" fill-opacity=".75" stroke="#334155" stroke-width="1" rx="24"/><g text-anchor="middle"><rect width="320" height="28" x="440" y="90" fill="url(#sub-grad)" opacity=".25" rx="14"/><rect width="320" height="28" x="440" y="90" fill="none" stroke="url(#sub-grad)" stroke-width="1" rx="14"/><text x="600" y="109" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">WEB AGENTS &amp; BROWSER AUTOMATION</text><text x="600" y="165" fill="url(#text-grad)" class="banner-title" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">Awesome AI Agent Web Automation</text><text x="600" y="212" fill="#94a3b8" class="banner-sub">The Curated Index of Autonomous Browser Agents, LLM Scrapers &amp; Web Infrastructure</text><g transform="translate(365, 235)"><text x="0" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">✨ Computer-Use</text><circle cx="115" cy="12" r="3" fill="#64748b"/><text x="135" y="16" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🚀 Headless Browsers</text><circle cx="285" cy="12" r="3" fill="#64748b"/><text x="305" y="16" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🧠 Agent-Native Data</text></g></g></svg>